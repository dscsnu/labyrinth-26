# Tunable rules and timings for the Labyrinth backend. This file is the single
# source for these values; secrets and deployment URLs stay in .env.
#
# Read once at startup (path: $CONFIG_FILE, default ./config.toml) and
# validated; the backend refuses to start on a bad value. Restart to apply a
# change. Durations use Go syntax: "30s", "2m", "12h".
#
# Not here, because they're fixed type sizes in the code: at most 64
# waypoints, 64 shapes and 2048 patterns (see internal/atlas/README.md).

[teams]
# Most players per team: no more can join. The leader can start with any
# number from 1 to this, once every other member is ready. Allowed: 1 to 16.
size = 6
# Longest team name, in characters. Allowed: 1 to 32 (the database's limit).
name_max_length = 32
# How many random 6-digit team codes to try before giving up on creating a
# team (a code can collide with an existing team's). Allowed: at least 1.
code_attempts = 10

[game]
# Most waypoints in any pattern: content with a bigger one is refused at
# startup. There's no time limit on an attempt, and one member may scan any
# number of a pattern's points. Allowed: 1 to 15 (the scan stack is a
# fixed-size array: a pattern's points plus one wrong scan).
max_pattern_points = 6
# How many bosses every team fights, in serial order: the boss table must hold
# exactly serials 1 to this, or startup is refused. (An empty table is allowed,
# before content is loaded: then casts hit no boss.) A team that defeats them
# all keeps casting, but its casts deal no more damage. Allowed: at least 1.
bosses = 7
# Every team's starting health. Each boss attack takes its attack_damage off
# it (boss table); at 0 the team is knocked out (no selecting or scanning)
# until an admin revives it, back to this. Allowed: at least 1.
health = 10

[qr]
# How often a waypoint's rotating QR changes, and thus how often the /qr
# display re-issues a token. Allowed: more than 0.
rotate = "5s"
# How much longer than rotate a scan stays accepted, absorbing the time a
# phone takes to scan and submit. A token is valid for rotate + tolerance
# after it's issued. Allowed: more than 0.
tolerance = "5s"

[spell]
# Base damage awarded per waypoint in the pattern (one per member involved).
# Allowed: more than 0.
per_point = 15
# Damage awarded per 100 meters of estimated walking distance.
# Allowed: 0 or more.
per_100m = 2
# Campus walkability multiplier (ratio of walking distance to straight-line distance).
# Allowed: at least 1.0.
walkability = 1.5

[auth]
# How long an access token (JWT) is valid. A role change applies at the next
# sign-in, so at most this long after it's made. Allowed: more than 0.
token_ttl = "12h"
# How long the SvelteKit server has to redeem a sign-in's one-time code.
# Allowed: more than 0.
login_code_ttl = "2m"
# How long a user may take on Google's sign-in screen. Allowed: at least 1s
# (the cookie's Max-Age is whole seconds).
oauth_state_ttl = "10m"
# How often unredeemed, expired login codes are deleted. Allowed: more than 0.
login_code_sweep = "10m"

[live]
# Idle event streams get a comment this often, so networks don't drop them.
# Allowed: more than 0.
heartbeat = "25s"
# How many events a slow client may fall behind before it's dropped (it
# reconnects and gets fresh state). Allowed: at least 1.
subscriber_buffer = 16
# How many locks the hub spreads open streams over, by user ID. More shards
# mean less waiting between publishers; a broadcast takes them one at a time.
# Allowed: at least 1.
hub_shards = 64
# How long one write to a stream may take before the client is cut off (a
# dead phone connection otherwise holds its stream open until TCP gives up).
# Allowed: more than 0.
write_timeout = "10s"
# Each stream tells its client to wait a random delay in this range before
# reconnecting, so a restart doesn't bring every client back at once.
# Allowed: retry_min at least 1ms, retry_max at least retry_min.
retry_min = "1s"
retry_max = "6s"

[server]
# How long a client may take to send request headers. Allowed: more than 0.
read_header_timeout = "10s"
# How long a client may take to send a whole request, body included. Event
# streams clear it once they start. Allowed: at least read_header_timeout.
read_timeout = "30s"
# How long an idle keep-alive connection stays open. Allowed: more than 0.
idle_timeout = "2m"
# How long shutdown waits for in-flight requests to finish. Allowed: more
# than 0; keep it above storage.write_timeout.
shutdown_timeout = "10s"
# Largest request body accepted, in bytes. Larger requests get 400.
# Allowed: at least 1.
max_body_bytes = 1048576

[storage]
# The most a write-through to Postgres may take before it's treated as failed
# and the affected state is reloaded. Allowed: more than 0.
write_timeout = "5s"
# How often the backend checks it still holds the single-instance lock, and
# also each check's timeout, so a lost lock is noticed within about twice this
# interval. If the lock's connection dies (e.g. Postgres restarts), the backend
# shuts down rather than risk a second instance running alongside it.
# Allowed: more than 0.
instance_lock_check = "5s"
