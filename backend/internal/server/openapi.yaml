openapi: 3.1.0
info:
  title: Labyrinth 26 API
  version: "0.1.0"
  description: |
    The Labyrinth 26 backend: a campus game where teams scan waypoints to trace shapes.

    **Envelope.** Every JSON response is `{"success", "code"?, "message"?, "payload"?}`.
    Errors carry a stable snake_case `code` the client switches on; only `500` has none.

    **Auth.** Routes under `/api` need `Authorization: Bearer <JWT>`. The JWT is an Ed25519
    (`EdDSA`) token from `POST /auth/token`, valid for `auth.token_ttl` (config.toml, 12 h).

    **Limits.** Request bodies over `server.max_body_bytes` (1 MiB) get `400 invalid_body`.
    Unknown paths get 404 `not_found`, wrong methods 405 `method_not_allowed`, both as envelopes.

    **Live updates** come over one server-sent event stream per user at `GET /api/events`, which also
    accepts the `labyrinth_token` cookie (a browser's EventSource can't send headers; the frontend and
    backend share a domain, so the browser sends it). The cookie is accepted on this route only.

    This file is checked against the code by `TestOpenAPIMatchesRoutes` (internal/server):
    every registered route and every error code must appear here, with codes listed
    in each response's description.
servers:
  - url: http://localhost:3000
    description: local dev backend
tags:
  - name: health
  - name: auth
    description: Google sign-in and tokens (see internal/auth/README.md)
  - name: user
  - name: teams
    description: Forming a team and starting the game (see internal/teams/README.md)
  - name: game
    description: Selecting a type and scanning (see internal/teamstate/README.md)
  - name: qr
    description: Rotating waypoint QR tokens (see internal/qr/README.md)
  - name: live
    description: Server-sent events
  - name: admin
    description: >-
      Admin-only routes. Every one needs a token and the ADMIN role as stored in the database (read on every
      request, never from the token, which can be up to `auth.token_ttl` stale): `403 not_admin` otherwise.

security:
  - bearer: []

paths:
  /health:
    get:
      tags: [health]
      summary: Health and runtime stats
      description: 200 if Postgres is reachable, with the process's uptime, open event streams and runtime/resource stats.
      security: []
      responses:
        "200":
          description: Healthy.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - properties:
                      payload: { $ref: "#/components/schemas/Health" }
        "503":
          description: Database unreachable (no code).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/google/login:
    get:
      tags: [auth]
      summary: Start Google sign-in
      description: |
        Sets a signed, HttpOnly state cookie (valid `auth.oauth_state_ttl`, 10 m) and redirects to
        Google with PKCE. The browser opens this directly.
      security: []
      parameters:
        - name: next
          in: query
          description: Same-site path to return to after sign-in; anything else becomes `/`.
          schema: { type: string, example: /team }
      responses:
        "302":
          description: Redirect to Google's consent screen.
          headers:
            Location: { schema: { type: string } }
            Set-Cookie: { schema: { type: string }, description: "labyrinth_oauth_state=…; Path=/auth/google; HttpOnly; SameSite=Lax" }

  /auth/google/callback:
    get:
      tags: [auth]
      summary: Google redirect target
      description: |
        Verifies the state and Google's ID token, signs the user in, and redirects to the frontend:
        `FRONTEND_URL/auth/callback?code=<login code>&next=<path>` on success (the code is single-use,
        valid `auth.login_code_ttl`, 2 m), or `FRONTEND_URL/auth/error?reason=<reason>` on failure.
      security: []
      parameters:
        - { name: state, in: query, schema: { type: string } }
        - { name: code, in: query, schema: { type: string } }
        - { name: error, in: query, description: Set by Google, e.g. access_denied, schema: { type: string } }
      responses:
        "302":
          description: |
            Redirect to the frontend. Failure `reason`s: `state_missing`, `state_invalid`, `state_mismatch`,
            `google_<error>` (e.g. `google_access_denied`), `code_missing`, `google_exchange_failed`,
            `email_unverified`, `email_domain_not_allowed`, `email_in_use`, `internal_error`.
          headers:
            Location: { schema: { type: string } }

  /auth/token:
    post:
      tags: [auth]
      summary: Redeem a login code for an access token
      description: |
        Called server to server by the SvelteKit app. The code is used up only if the token is issued,
        so a failure here can be retried with the same code.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              additionalProperties: false
              properties:
                code: { type: string, example: "Zk3…base64url" }
      responses:
        "200":
          description: Token issued.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - properties:
                      payload: { $ref: "#/components/schemas/TokenResponse" }
        "400":
          $ref: "#/components/responses/Error"
          description: "Codes: `invalid_body`, `invalid_code`"
        "404":
          $ref: "#/components/responses/Error"
          description: "Codes: `user_not_found`"

  /api/me:
    get:
      tags: [user]
      summary: The signed-in user
      description: Read from the database, so the role is current even if it changed since sign-in.
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - properties:
                      payload: { $ref: "#/components/schemas/User" }
        "429": { $ref: "#/components/responses/RateLimited", description: "Codes: `rate_limited`" }
        "401":
          $ref: "#/components/responses/Error"
          description: "Codes: `missing_token`, `invalid_token`, `user_not_found`"

  /api/teams/me:
    get:
      tags: [teams]
      summary: Your team
      responses:
        "200": { $ref: "#/components/responses/Team" }
        "429": { $ref: "#/components/responses/RateLimited", description: "Codes: `rate_limited`" }
        "401": { $ref: "#/components/responses/Unauthorized", description: "Codes: `missing_token`, `invalid_token`" }
        "404": { $ref: "#/components/responses/Error", description: "Codes: `not_in_team`" }

  /api/teams:
    post:
      tags: [teams]
      summary: Create a team
      description: You become its leader. The name is trimmed and must be 1 to `teams.name_max_length` (32) characters, no control characters.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name: { type: string, example: Scott Pilgrim's Fan Club }
      responses:
        "201": { $ref: "#/components/responses/Team" }
        "400": { $ref: "#/components/responses/Error", description: "Codes: `invalid_body`, `invalid_team_name`" }
        "429": { $ref: "#/components/responses/RateLimited", description: "Codes: `rate_limited`" }
        "401": { $ref: "#/components/responses/Unauthorized", description: "Codes: `missing_token`, `invalid_token`" }
        "409": { $ref: "#/components/responses/Error", description: "Codes: `already_in_team`" }

  /api/teams/join:
    post:
      tags: [teams]
      summary: Join a team by its code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [team_id]
              additionalProperties: false
              properties:
                team_id: { type: string, pattern: "^[0-9]{6}$", example: "482913" }
      responses:
        "200": { $ref: "#/components/responses/Team" }
        "400": { $ref: "#/components/responses/Error", description: "Codes: `invalid_body`, `invalid_team_id`" }
        "429": { $ref: "#/components/responses/RateLimited", description: "Codes: `rate_limited`" }
        "401": { $ref: "#/components/responses/Unauthorized", description: "Codes: `missing_token`, `invalid_token`" }
        "404": { $ref: "#/components/responses/Error", description: "Codes: `team_not_found`" }
        "409": { $ref: "#/components/responses/Error", description: "Codes: `already_in_team`, `team_full`, `team_locked`" }

  /api/teams/leave:
    post:
      tags: [teams]
      summary: Leave your team (lobby only)
      description: If the leader leaves, the earliest remaining member becomes leader. The last member leaving deletes the team.
      responses:
        "200":
          description: Left. No payload.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
        "429": { $ref: "#/components/responses/RateLimited", description: "Codes: `rate_limited`" }
        "401": { $ref: "#/components/responses/Unauthorized", description: "Codes: `missing_token`, `invalid_token`" }
        "404": { $ref: "#/components/responses/Error", description: "Codes: `not_in_team`" }
        "409": { $ref: "#/components/responses/Error", description: "Codes: `team_locked`" }

  /api/teams/me/ready:
    put:
      tags: [teams]
      summary: Set your ready flag (non-leaders, lobby only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ready]
              additionalProperties: false
              properties:
                ready: { type: boolean }
      responses:
        "200": { $ref: "#/components/responses/Team" }
        "400": { $ref: "#/components/responses/Error", description: "Codes: `invalid_body`" }
        "429": { $ref: "#/components/responses/RateLimited", description: "Codes: `rate_limited`" }
        "401": { $ref: "#/components/responses/Unauthorized", description: "Codes: `missing_token`, `invalid_token`" }
        "404": { $ref: "#/components/responses/Error", description: "Codes: `not_in_team`" }
        "409": { $ref: "#/components/responses/Error", description: "Codes: `team_locked`, `leader_cannot_ready`" }

  /api/teams/me/start:
    post:
      tags: [teams]
      summary: Start the game (leader only)
      description: Any size from 1 to `teams.size` (6) may start, once every non-leader is ready. `LOBBY` → `IN_GAME`; the roster is then frozen. Every member's event stream gets the `IN_GAME` `team`, then the team's empty `team_state`.
      responses:
        "200": { $ref: "#/components/responses/Team" }
        "429": { $ref: "#/components/responses/RateLimited", description: "Codes: `rate_limited`" }
        "401": { $ref: "#/components/responses/Unauthorized", description: "Codes: `missing_token`, `invalid_token`" }
        "403": { $ref: "#/components/responses/Error", description: "Codes: `not_leader`" }
        "404": { $ref: "#/components/responses/Error", description: "Codes: `not_in_team`" }
        "409": { $ref: "#/components/responses/Error", description: "Codes: `team_locked`, `not_all_ready`" }

  /api/admin/teams:
    get:
      tags: [admin]
      summary: Every team, with its game at a glance
      description: >-
        Every team in memory, sorted by ID: the team (members, leader, status) and, for a started or finished one,
        its game at a glance (health, knocked out, boss, cooldowns), so an admin sees who needs a revive or a
        cooldown reset. For the admin panel.
      responses:
        "200":
          description: Every team.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - properties:
                      payload:
                        type: array
                        items: { $ref: "#/components/schemas/TeamOverview" }
        "429": { $ref: "#/components/responses/RateLimited", description: "Codes: `rate_limited`" }
        "401": { $ref: "#/components/responses/Unauthorized", description: "Codes: `missing_token`, `invalid_token`, `user_not_found`" }
        "403": { $ref: "#/components/responses/Error", description: "Codes: `not_admin`" }

  /api/admin/teams/{team_id}:
    delete:
      tags: [admin]
      summary: Delete a team
      description: >-
        Deletes the team in any status, and with it (ON DELETE CASCADE) its members and all its progress: scans,
        patterns, casts, boss progress. Every member gets `no_team` of type `team_deleted` and is free to create or
        join a team; team state forgets the team and stops its timer. Logged with the admin's ID.
      parameters:
        - { name: team_id, in: path, required: true, schema: { type: string, pattern: "^[0-9]{6}$" }, example: "482913" }
      responses:
        "200":
          description: Deleted. No payload.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
        "400": { $ref: "#/components/responses/Error", description: "Codes: `invalid_team_id`" }
        "429": { $ref: "#/components/responses/RateLimited", description: "Codes: `rate_limited`" }
        "401": { $ref: "#/components/responses/Unauthorized", description: "Codes: `missing_token`, `invalid_token`, `user_not_found`" }
        "403": { $ref: "#/components/responses/Error", description: "Codes: `not_admin`" }
        "404": { $ref: "#/components/responses/Error", description: "Codes: `team_not_found`" }

  /api/admin/teams/{team_id}/cooldowns/reset:
    post:
      tags: [admin]
      summary: Reset a team's cooldowns
      description: >-
        From now, none of the team's casts so far puts its spell class or its waypoints on cooldown:
        `cooldown_class` becomes null and `qr_cooldowns` empty. Later casts start new cooldowns as usual. Stored
        (`team_boss.cooldowns_reset_casts`, the cast log's length at the reset), so it survives a restart. Members get `team_state` of type
        `cooldowns_reset`. Returns the team's state. Logged with the admin's ID.
      parameters:
        - { name: team_id, in: path, required: true, schema: { type: string, pattern: "^[0-9]{6}$" }, example: "482913" }
      responses:
        "200": { $ref: "#/components/responses/TeamState" }
        "400": { $ref: "#/components/responses/Error", description: "Codes: `invalid_team_id`" }
        "429": { $ref: "#/components/responses/RateLimited", description: "Codes: `rate_limited`" }
        "401": { $ref: "#/components/responses/Unauthorized", description: "Codes: `missing_token`, `invalid_token`, `user_not_found`" }
        "403": { $ref: "#/components/responses/Error", description: "Codes: `not_admin`" }
        "404": { $ref: "#/components/responses/Error", description: "Codes: `team_not_found`" }
        "409": { $ref: "#/components/responses/Error", description: "Codes: `not_in_game`" }

  /api/admin/teams/{team_id}/powerups/{kind}:
    post:
      tags: [admin]
      summary: Grant a team a powerup
      description: >-
        The team gets a powerup of `kind` to hold until its leader activates it. A team holds at most one of each
        kind: if it already holds one, this one is wasted (`granted: false`, nothing changes, no event). Otherwise
        members get `team_state` of type `powerup_granted`. Allowed while knocked out. Logged with the admin's ID.
      parameters:
        - { name: team_id, in: path, required: true, schema: { type: string, pattern: "^[0-9]{6}$" }, example: "482913" }
        - { name: kind, in: path, required: true, schema: { $ref: "#/components/schemas/PowerupKind" } }
      responses:
        "200":
          description: Granted, or wasted.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - properties:
                      payload:
                        type: object
                        required: [granted, state]
                        properties:
                          granted: { type: boolean, description: "The team now holds it because of this grant; false: it already held one." }
                          state: { $ref: "#/components/schemas/TeamState" }
        "400": { $ref: "#/components/responses/Error", description: "Codes: `invalid_team_id`" }
        "401": { $ref: "#/components/responses/Unauthorized", description: "Codes: `missing_token`, `invalid_token`, `user_not_found`" }
        "403": { $ref: "#/components/responses/Error", description: "Codes: `not_admin`" }
        "404": { $ref: "#/components/responses/Error", description: "Codes: `team_not_found`, `unknown_powerup`" }
        "409": { $ref: "#/components/responses/Error", description: "Codes: `not_in_game`" }

  /api/admin/users:
    get:
      tags: [admin]
      summary: Find users by email
      description: Up to `admin.user_search_limit` (20) users whose email contains `email` (case insensitive), by email. No `email` lists the first ones.
      parameters:
        - { name: email, in: query, required: false, schema: { type: string }, example: "snu.edu.in" }
      responses:
        "200":
          description: The users found.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - properties:
                      payload:
                        type: array
                        items: { $ref: "#/components/schemas/User" }
        "429": { $ref: "#/components/responses/RateLimited", description: "Codes: `rate_limited`" }
        "401": { $ref: "#/components/responses/Unauthorized", description: "Codes: `missing_token`, `invalid_token`, `user_not_found`" }
        "403": { $ref: "#/components/responses/Error", description: "Codes: `not_admin`" }

  /api/admin/users/{user_id}/role:
    put:
      tags: [admin]
      summary: Set a user's role
      description: >-
        Gives the user `PLAYER`, `HELPER` or `ADMIN`. Every route that checks the role reads it from the database,
        so it applies at once (the token's copy updates at their next sign-in). An admin can't change their own
        role (`cannot_change_own_role`): another admin must. Returns the user. Logged with the admin's ID.
      parameters:
        - { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              additionalProperties: false
              properties:
                role: { type: string, enum: [PLAYER, HELPER, ADMIN] }
      responses:
        "200":
          description: The user, with the new role.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - properties:
                      payload: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Error", description: "Codes: `invalid_user_id`, `invalid_body`, `invalid_role`" }
        "429": { $ref: "#/components/responses/RateLimited", description: "Codes: `rate_limited`" }
        "401": { $ref: "#/components/responses/Unauthorized", description: "Codes: `missing_token`, `invalid_token`, `user_not_found`" }
        "403": { $ref: "#/components/responses/Error", description: "Codes: `not_admin`" }
        "404": { $ref: "#/components/responses/Error", description: "Codes: `user_not_found`" }
        "409": { $ref: "#/components/responses/Error", description: "Codes: `cannot_change_own_role`" }

  /api/leaderboard:
    get:
      tags: [game]
      summary: The leaderboard
      description: >-
        The top `leaderboard.size` (10) started or finished teams, ranked now: bosses defeated (more first), then
        when the latest boss fell (earlier first; a team with none after any with some), then damage on the current
        boss (more first), then team ID. Plus the caller's own team's entry (`me`, null without a started team).
        Every stream also gets the top as the game-wide `leaderboard` event.
      responses:
        "200":
          description: The top, and the caller's team.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - properties:
                      payload: { $ref: "#/components/schemas/LeaderboardMine" }
        "429": { $ref: "#/components/responses/RateLimited", description: "Codes: `rate_limited`" }
        "401": { $ref: "#/components/responses/Unauthorized", description: "Codes: `missing_token`, `invalid_token`" }

  /api/admin/teams/{team_id}/members/{user_id}:
    delete:
      tags: [admin]
      summary: Remove a member from a team
      description: |
        Works on a team in any status: lobby, or started (an admin is the only way a started team's roster
        changes). If the member leads the team, `new_leader` must name a remaining member, who becomes leader;
        otherwise `new_leader` must be absent. The team's only member can't be removed (`last_member`): this
        never deletes a team.

        The team's members get the new `team` event; the removed player gets `no_team` and stops getting the
        team's `team_state`. Their game writes are refused (`404 not_in_team`) from the moment the removal is
        visible; a write already holding the team's lock finishes first. Their past scans and casts stay with
        the team. They're free to create or join a team. Logged with the admin's ID.
      parameters:
        - { name: team_id, in: path, required: true, schema: { type: string, pattern: "^[0-9]{6}$" }, example: "482913" }
        - { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: new_leader, in: query, required: false, schema: { type: string, format: uuid }, description: Required when removing the leader; a remaining member. }
      responses:
        "200": { $ref: "#/components/responses/Team" }
        "400": { $ref: "#/components/responses/Error", description: "Codes: `invalid_team_id`, `invalid_user_id`" }
        "429": { $ref: "#/components/responses/RateLimited", description: "Codes: `rate_limited`" }
        "401": { $ref: "#/components/responses/Unauthorized", description: "Codes: `missing_token`, `invalid_token`, `user_not_found`" }
        "403": { $ref: "#/components/responses/Error", description: "Codes: `not_admin`" }
        "404": { $ref: "#/components/responses/Error", description: "Codes: `team_not_found`, `not_a_member`" }
        "409":
          $ref: "#/components/responses/Error"
          description: "Codes: `last_member`, `new_leader_required`, `invalid_new_leader`"

  /api/admin/teams/{team_id}/revive:
    post:
      tags: [admin]
      summary: Revive a team
      description: |
        Restores a started team's health to `game.health` (10) and restarts its current boss's attack clock
        from now: the boss's attacks so far no longer count, and the next comes one `attack_interval_s` later.
        Works whether or not the team is knocked out (so it also heals). Members get `team_state` of type
        `revived`. Returns the team's state. Logged with the admin's ID.
      parameters:
        - { name: team_id, in: path, required: true, schema: { type: string, pattern: "^[0-9]{6}$" }, example: "482913" }
      responses:
        "200": { $ref: "#/components/responses/TeamState" }
        "400": { $ref: "#/components/responses/Error", description: "Codes: `invalid_team_id`" }
        "429": { $ref: "#/components/responses/RateLimited", description: "Codes: `rate_limited`" }
        "401": { $ref: "#/components/responses/Unauthorized", description: "Codes: `missing_token`, `invalid_token`, `user_not_found`" }
        "403": { $ref: "#/components/responses/Error", description: "Codes: `not_admin`" }
        "404": { $ref: "#/components/responses/Error", description: "Codes: `team_not_found`" }
        "409": { $ref: "#/components/responses/Error", description: "Codes: `not_in_game`" }

  /api/game/shapes:
    get:
      tags: [game]
      summary: Pattern types to pick
      description: The shapes ("types" on the client) a team can select. There's no time limit, so no timing rules.
      responses:
        "200":
          description: Shapes.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - properties:
                      payload: { $ref: "#/components/schemas/Game" }
        "429": { $ref: "#/components/responses/RateLimited", description: "Codes: `rate_limited`" }
        "401": { $ref: "#/components/responses/Unauthorized", description: "Codes: `missing_token`, `invalid_token`" }

  /api/game/bosses:
    get:
      tags: [game]
      summary: The bosses every team fights
      description: >-
        Every boss in serial order: every team fights them in this order, the same for everyone and static while
        the backend runs (`game.bosses` of them; empty before boss content is loaded). A team's progress is in
        its `team_state` (`boss`, `bosses_defeated`, `damage_multiplier`).
      responses:
        "200":
          description: The bosses, serial 1 first.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - properties:
                      payload:
                        type: array
                        items: { $ref: "#/components/schemas/Boss" }
        "429": { $ref: "#/components/responses/RateLimited", description: "Codes: `rate_limited`" }
        "401": { $ref: "#/components/responses/Unauthorized", description: "Codes: `missing_token`, `invalid_token`" }

  /api/teams/me/state:
    get:
      tags: [game]
      summary: Your team's game state
      responses:
        "200": { $ref: "#/components/responses/TeamState" }
        "429": { $ref: "#/components/responses/RateLimited", description: "Codes: `rate_limited`" }
        "401": { $ref: "#/components/responses/Unauthorized", description: "Codes: `missing_token`, `invalid_token`" }
        "404": { $ref: "#/components/responses/Error", description: "Codes: `not_in_team`" }

  /api/teams/me/casts:
    get:
      tags: [game]
      summary: Your team's cast log
      description: >-
        Every pattern your team has completed, repeats included (`already_completed`), newest first. Read from
        memory (the `team_cast` table, loaded at startup). Not pushed on the stream: `team_state.last_cast`
        carries each new cast, so a client loads this once and prepends each new `last_cast` it sees.
      responses:
        "200":
          description: The cast log, newest first; empty before the first cast.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - properties:
                      payload:
                        type: array
                        items: { $ref: "#/components/schemas/Cast" }
        "429": { $ref: "#/components/responses/RateLimited", description: "Codes: `rate_limited`" }
        "401": { $ref: "#/components/responses/Unauthorized", description: "Codes: `missing_token`, `invalid_token`" }
        "404": { $ref: "#/components/responses/Error", description: "Codes: `not_in_team`" }

  /api/teams/me/state/selection:
    put:
      tags: [game]
      summary: Select a pattern type
      description: >-
        **Only the leader** selects (`403 not_leader`). **Always purges the team's scan stack**, reselecting the
        same type included, so reselecting is how a team restarts a poisoned attempt. A type whose patterns are all
        bigger than the team's `unlocked_points` is refused (`409 shape_locked`): patterns of
        `game.locked_pattern_points` (5) or more waypoints unlock once the team has defeated
        `game.unlock_after_bosses` (5) bosses. **Spell cooldown:** the class of the team's last cast
        (`team_state.cooldown_class`) can't be cast again until a spell of another class is, so a type whose
        unlocked patterns are all of that class is refused (`409 shape_on_cooldown`; `team_state.cooldown_shapes`
        lists them).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shape]
              additionalProperties: false
              properties:
                shape: { type: string, example: quadrilateral }
      responses:
        "200": { $ref: "#/components/responses/TeamState" }
        "400": { $ref: "#/components/responses/Error", description: "Codes: `invalid_body`" }
        "429": { $ref: "#/components/responses/RateLimited", description: "Codes: `rate_limited`" }
        "401": { $ref: "#/components/responses/Unauthorized", description: "Codes: `missing_token`, `invalid_token`" }
        "403": { $ref: "#/components/responses/Error", description: "Codes: `not_leader`" }
        "404": { $ref: "#/components/responses/Error", description: "Codes: `unknown_shape`, `not_in_team`" }
        "409": { $ref: "#/components/responses/Error", description: "Codes: `not_in_game`, `knocked_out`, `shape_locked`, `shape_on_cooldown`" }
    delete:
      tags: [game]
      summary: Give up the selection
      description: >-
        **Only the leader** gives up (`403 not_leader`). Clears the selection and purges the stack. A no-op 200 if
        nothing is selected. Allowed when knocked out.
      responses:
        "200": { $ref: "#/components/responses/TeamState" }
        "429": { $ref: "#/components/responses/RateLimited", description: "Codes: `rate_limited`" }
        "401": { $ref: "#/components/responses/Unauthorized", description: "Codes: `missing_token`, `invalid_token`" }
        "403": { $ref: "#/components/responses/Error", description: "Codes: `not_leader`" }
        "404": { $ref: "#/components/responses/Error", description: "Codes: `not_in_team`" }
        "409": { $ref: "#/components/responses/Error", description: "Codes: `not_in_game`" }

  /api/teams/me/state/scans:
    post:
      tags: [game]
      summary: Scan a waypoint
      description: |
        No time limit, and any member may scan any number of the pattern's waypoints. The body carries the
        waypoint's signed, fresh QR token (see `internal/qr/README.md`); an invalid token is refused with
        `invalid_qr` and a stale one with `qr_expired`. Rejected **without being pushed** if no type is
        selected (`no_shape_selected`), the attempt is poisoned (`selection_poisoned`: reselect to restart),
        the waypoint is already in the stack (`waypoint_already_scanned`, a retry included), or the team cast a
        spell with it less than `game.qr_cooldown` (5 min) ago (`waypoint_on_cooldown`: it's in
        `team_state.qr_cooldowns`, and opens again at its `until`). A scan whose
        waypoint, with the stack, can't be part of any pattern of the selected type is pushed **marked
        `wrong`**, with outcome `wrong_scan`: the attempt is poisoned (`poisoned: true`) until someone
        reselects. Once the stack is exactly a pattern of the selected type, it completes (a cast, logged in
        `team_cast`): the stack and selection are purged and `last_cast` is set.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [qr]
              additionalProperties: false
              properties:
                qr: { type: string, description: The signed token read off the waypoint's QR code., example: "2001:1760000000.nR5…" }
      responses:
        "200":
          description: Accepted.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - properties:
                      payload: { $ref: "#/components/schemas/ScanResult" }
        "400": { $ref: "#/components/responses/Error", description: "Codes: `invalid_body`, `invalid_qr`" }
        "429": { $ref: "#/components/responses/RateLimited", description: "Codes: `rate_limited`" }
        "401": { $ref: "#/components/responses/Unauthorized", description: "Codes: `missing_token`, `invalid_token`" }
        "404": { $ref: "#/components/responses/Error", description: "Codes: `unknown_waypoint`, `not_in_team`" }
        "409":
          $ref: "#/components/responses/Error"
          description: "Codes: `not_in_game`, `knocked_out`, `no_shape_selected`, `selection_poisoned`, `waypoint_already_scanned`, `waypoint_on_cooldown`, `qr_expired`"

  /api/teams/me/state/powerups/{kind}:
    post:
      tags: [game]
      summary: Use a held powerup
      description: |
        The leader uses the team's held powerup of `kind` (powerups are temporary effects, at most one of each
        kind held). Members get `team_state`.
        - `damage_multiplier`: the team's next cast deals × `powerups.damage_multiplier` (2), then it's used up.
        - `heart`: +`powerups.heart` (1) health, never above `game.health`; the attack clock doesn't move.
          `full_health` at full health.
        - `short_qr_cooldown`: for `powerups.short_qr_window` (5 min), casts cool their waypoints for
          `powerups.short_qr_cooldown` (2 min) instead of `game.qr_cooldown`.
        - `instant_cast`: body `{"pattern": [waypoint IDs]}`; that pattern is cast at once, with no scans,
          whatever the class and QR cooldowns (a locked big pattern is still `pattern_locked`). Then it's a cast
          like any other (`spell_cast` or `boss_defeated`, `last_cast.instant`); the selection and stack are
          purged.

        The first three publish `powerup_activated`. A kind still running (an armed multiplier, a running short
        QR cooldown) is `powerup_active`. A resend finds it used: `powerup_not_held`.
      parameters:
        - { name: kind, in: path, required: true, schema: { $ref: "#/components/schemas/PowerupKind" } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: Only for `instant_cast`; the other kinds read no body.
              required: [pattern]
              additionalProperties: false
              properties:
                pattern: { type: array, minItems: 1, items: { type: string }, description: "The pattern's waypoint IDs, each once, any order.", example: ["2001", "2002", "2007", "2008"] }
      responses:
        "200": { $ref: "#/components/responses/TeamState" }
        "400": { $ref: "#/components/responses/Error", description: "Codes: `invalid_body`" }
        "401": { $ref: "#/components/responses/Unauthorized", description: "Codes: `missing_token`, `invalid_token`" }
        "403": { $ref: "#/components/responses/Error", description: "Codes: `not_leader`" }
        "404": { $ref: "#/components/responses/Error", description: "Codes: `unknown_powerup`, `not_in_team`, `unknown_waypoint`, `unknown_pattern`" }
        "409":
          $ref: "#/components/responses/Error"
          description: "Codes: `not_in_game`, `knocked_out`, `powerup_not_held`, `powerup_active`, `full_health`, `pattern_locked`"

  /api/qr/{waypoint_id}:
    get:
      tags: [qr]
      summary: The waypoint's signing key and timing rules
      description: |
        Staff only (HELPER or ADMIN, read from the database each request). Returns the waypoint-scoped
        HMAC key and the timing rules; the `/qr` display signs its own rotating tokens locally (no
        polling), one per `qr.rotate`. Each token is valid for `qr.rotate` + `qr.tolerance` (10 s).
      parameters:
        - { name: waypoint_id, in: path, required: true, schema: { type: string, pattern: "^[0-9]{4}$" }, example: "2001" }
      responses:
        "200":
          description: The signing key and timing rules.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - properties:
                      payload: { $ref: "#/components/schemas/SigningKey" }
        "400": { $ref: "#/components/responses/Error", description: "Codes: `invalid_waypoint_id`" }
        "429": { $ref: "#/components/responses/RateLimited", description: "Codes: `rate_limited`" }
        "401": { $ref: "#/components/responses/Unauthorized", description: "Codes: `missing_token`, `invalid_token`" }
        "403": { $ref: "#/components/responses/Error", description: "Codes: `not_staff`" }
        "404": { $ref: "#/components/responses/Error", description: "Codes: `unknown_waypoint`" }

  /api/qr/verify:
    post:
      tags: [qr]
      summary: Verify a scanned token
      description: |
        Any signed-in user; changes nothing. Returns the waypoint a token stands for if its signature
        checks out and it's within its window, so a scanner can be tested without touching team state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [qr]
              additionalProperties: false
              properties:
                qr: { type: string, description: The token read off the QR., example: "2001:1760000000.nR5…" }
      responses:
        "200":
          description: The waypoint.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - properties:
                      payload: { $ref: "#/components/schemas/QRVerify" }
        "400": { $ref: "#/components/responses/Error", description: "Codes: `invalid_body`, `invalid_qr`" }
        "429": { $ref: "#/components/responses/RateLimited", description: "Codes: `rate_limited`" }
        "401": { $ref: "#/components/responses/Unauthorized", description: "Codes: `missing_token`, `invalid_token`" }
        "409": { $ref: "#/components/responses/Error", description: "Codes: `qr_expired`" }

  /api/events:
    get:
      tags: [live]
      summary: Live event stream (server-sent events)
      security:
        - bearer: []
        - tokenCookie: []
      description: |
        `text/event-stream`, the caller's one stream: it carries events of every scope (the user's own, their
        team's, and game-wide). On connect: a `retry:` line (a random reconnect delay between `live.retry_min`
        and `live.retry_max`, 1–6 s, so a restart doesn't bring every client back at once), then `hello`, then
        `team` (or `no_team`), then `team_state` if you're in a team, then game-wide resources (`leaderboard`). Then
        one event per change, and a `: ping` comment after `live.heartbeat` (25 s) with no event. A client that
        falls `live.subscriber_buffer` (16) events behind, or can't take a write within `live.write_timeout`
        (10 s), is dropped and should reconnect (EventSource does this itself).

        **Every event's `data` is an envelope**, `{"type": …, "message": …}`. The SSE `event:` name is the
        resource (`team`, `team_state`, …); `type` is why it was sent (`spell_cast`, `member_joined`, …, or
        `snapshot` on connect, `resync` after a failed write was reloaded); `message` is the resource's
        **full** state, never a diff: the same JSON as its GET route. A client that only renders state reads
        `message` and ignores `type`; one that animates or notifies switches on `type`. Each envelope is a
        schema here: `HelloEvent`, `TeamEvent`, `NoTeamEvent`, `TeamStateEvent`, `LeaderboardEvent`.

        `team` and `team_state` carry a `version` (`Version`): keep an incoming copy only if its `epoch`
        differs from the one you hold, or the epoch matches and `seq` is higher. Write responses carry the same
        `version`, so a response and its event can arrive in either order. `team_state.cast_count` says how
        many casts the log (`GET /api/teams/me/casts`) holds: re-fetch it when it's more than you have.

        Nobody subscribes to channels: the server routes each event by user ID, to one user, to a team's
        current members, or to every stream. Rejections and no-ops publish nothing. Only two changes happen with
        nobody acting, both on the server's timer: `boss_attacked` / `knocked_out` and `qr_cooldown_ended`.
        The full reference (every type and when it's sent, ordering, versioning, reconnection, and a client example) is `backend/internal/server/README.md`, "The event stream".

        Later game-wide events (quizzes, quick-time events) will use the same envelope as `leaderboard`,
        with `message` `null` when nothing is active, or an object with at least an `id`. Their schemas are not final.

        | event | scope | data | `type` values |
        |---|---|---|---|
        | `hello` | stream | `HelloEvent` | `connected` |
        | `team` | team | `TeamEvent` | `snapshot`, `created`, `member_joined`, `member_left`, `leader_changed`, `member_removed`, `ready_changed`, `started`, `profile_updated`, `finished`, `resync` |
        | `no_team` | user | `NoTeamEvent` | `snapshot`, `left`, `team_deleted`, `removed`, `resync` |
        | `team_state` | team | `TeamStateEvent` | `snapshot`, `game_started`, `shape_selected`, `selection_cleared`, `scan_added`, `wrong_scan`, `spell_cast`, `boss_defeated`, `boss_attacked`, `knocked_out`, `qr_cooldown_ended`, `cooldowns_reset`, `revived`, `resync` |
        | `leaderboard` | game | `LeaderboardEvent` | `snapshot`, `updated` |

        ```
        retry: 3412

        event: hello
        data: {"type":"connected","message":{"server_time":"2026-10-18T12:00:00.123456Z"}}

        event: team
        data: {"type":"snapshot","message":{"id":"482913","name":"Scanners",…,"version":{"epoch":1760788800000,"seq":7}}}

        event: team_state
        data: {"type":"snapshot","message":{"team_id":"482913",…,"cast_count":0,"version":{"epoch":1760788800000,"seq":0}}}

        event: team_state
        data: {"type":"spell_cast","message":{"team_id":"482913",…,"last_cast":{…},"cast_count":1,"version":{"epoch":1760788800000,"seq":5}}}

        : ping
        ```
      responses:
        "200":
          description: The stream.
          content:
            text/event-stream:
              schema: { type: string }
        "429": { $ref: "#/components/responses/RateLimited", description: "Codes: `rate_limited`" }
        "401": { $ref: "#/components/responses/Unauthorized", description: "Codes: `missing_token`, `invalid_token`" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT (EdDSA)
    tokenCookie:
      type: apiKey
      in: cookie
      name: labyrinth_token
      description: The access token in the SvelteKit app's httpOnly cookie. Accepted only by `GET /api/events`.

  responses:
    Error:
      description: |
        A rule or input error. Each use lists the `code`s it can carry.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: >-
        Too many requests from this user (`rate_limited`): each signed-in user has a token bucket of
        `ratelimit.per_second` (10) requests a second in bursts of up to `ratelimit.burst` (40). Wait
        `Retry-After` seconds and retry; nothing was done.
      headers:
        Retry-After: { schema: { type: integer, minimum: 1 }, description: Whole seconds until a request will be allowed. }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing (`missing_token`) or invalid/expired (`invalid_token`) bearer token. Sets `WWW-Authenticate`.
      headers:
        WWW-Authenticate: { schema: { type: string, example: 'Bearer error="invalid_token"' } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Team:
      description: The team after the change.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Success"
              - properties:
                  payload: { $ref: "#/components/schemas/Team" }
    TeamState:
      description: The team's game state after the change.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Success"
              - properties:
                  payload: { $ref: "#/components/schemas/TeamState" }

  schemas:
    HelloEvent:
      type: object
      description: The data of a `hello` event.
      required: [type, message]
      properties:
        type: { type: string, enum: [connected] }
        message: { $ref: "#/components/schemas/Hello" }
    TeamEvent:
      type: object
      description: |
        The data of a `team` event, sent to the team's members; `message` is the whole team. Types:
        `snapshot` (on connect), `created` (the creator), `member_joined`, `member_left` (a member left, the
        leader didn't change), `leader_changed` (the leader left, or an admin removed them; see `leader_id`),
        `member_removed` (an admin removed a non-leader), `ready_changed`, `started` (now `IN_GAME`; its
        `team_state` of type `game_started` follows), `profile_updated` (a member's name or avatar), `resync`
        (reloaded after a failed write).
      required: [type, message]
      properties:
        type: { type: string, enum: [snapshot, created, member_joined, member_left, leader_changed, member_removed, ready_changed, started, profile_updated, finished, resync] }
        message: { $ref: "#/components/schemas/Team" }
    NoTeamEvent:
      type: object
      description: |
        The data of a `no_team` event, sent to one user who is in no team; `message` is always `{}`. Types:
        `snapshot` (on connect), `left` (they left, the team carries on), `team_deleted` (the team is gone:
        they were its last member, or an admin deleted it), `removed` (an admin removed them), `resync` (a reload after a failed
        write found them no longer in it). Clear both the team and its team state.
      required: [type, message]
      properties:
        type: { type: string, enum: [snapshot, left, team_deleted, removed, resync] }
        message: { type: object, maxProperties: 0 }
    TeamStateEvent:
      type: object
      description: |
        The data of a `team_state` event, sent to the team's members; `message` is the whole state. Types:
        `snapshot` (on connect), `game_started` (right after the `team` event of type `started`),
        `shape_selected` (a spell attempt starts; the stack was purged), `selection_cleared`, `scan_added`,
        `wrong_scan` (the attempt is now `poisoned`), `spell_cast` (`last_cast` is the new cast, `cast_count`
        went up, the selection and stack were purged, its damage went to the current boss), `boss_defeated` (a
        `spell_cast` that defeated the boss: `bosses_defeated` went up and `boss` is the next one, or null, whose
        attack clock starts now), `boss_attacked` (the boss's interval passed, with nobody acting: `health` down,
        `boss.attacks` up), `knocked_out` (an attack brought `health` to 0), `qr_cooldown_ended` (with nobody
        acting, waypoints left `qr_cooldowns` and can be scanned again; an attack due at the same moment sends
        `boss_attacked` or `knocked_out` instead), `revived` (an admin revived the team), `powerup_granted`
        (`powerups.held` gained a kind), `powerup_activated` (the leader used a damage_multiplier, heart or
        short_qr_cooldown), `powerup_ended` (with nobody acting, a short_qr_cooldown's window ended; an attack due
        at the same moment sends `boss_attacked` or `knocked_out` instead), `resync` (reloaded after a failed write).
      required: [type, message]
      properties:
        type: { type: string, enum: [snapshot, game_started, shape_selected, selection_cleared, scan_added, wrong_scan, spell_cast, boss_defeated, boss_attacked, knocked_out, qr_cooldown_ended, cooldowns_reset, revived, powerup_granted, powerup_activated, powerup_ended, resync] }
        message: { $ref: "#/components/schemas/TeamState" }
    QRCooldown:
      type: object
      description: A waypoint on the team's QR cooldown.
      required: [waypoint_id, until]
      properties:
        waypoint_id: { type: string, description: The waypoint's 4-digit ID., example: "2001" }
        until:
          type: string
          format: date-time
          description: >-
            When it opens again: its latest cast's `cast_at` + `game.qr_cooldown`. A scan at exactly this
            moment is accepted.
          example: "2026-10-17T12:05:04Z"
    Version:
      type: object
      description: |
        Orders one resource's snapshots (one team's `team`, or its `team_state`), compared only against the
        same resource. Keep an incoming copy if `epoch` differs from the one you hold, or `epoch` matches and
        `seq` is higher; otherwise drop it. `seq` goes up by one on every change; `epoch` is the backend
        process, so after a restart `seq` starts again in a new epoch. A repeat of the same version (a
        snapshot, or a write response matching its event) is the same state. Two numbers, because JavaScript
        can't hold integers above 2^53 exactly.
      required: [epoch, seq]
      properties:
        epoch: { type: integer, format: int64, description: The backend process's start time, Unix milliseconds., example: 1760788800000 }
        seq: { type: integer, format: int64, minimum: 0, description: Changes since the process started; 0 for a resource unchanged since then., example: 5 }
    Hello:
      type: object
      description: |
        The first event on every stream, and the canonical clock for clients. On each one, so on every
        connect, a client re-measures its offset: server_time minus its own monotonic clock. Anything a
        client shows relative to now ("scanned 2 min ago", a future countdown) uses it, so every phone agrees.
        The game has no time limit; clients never decide state from time. Carries nothing else.
      required: [server_time]
      properties:
        server_time: { type: string, format: date-time, description: The server's clock when the stream opened, UTC. }
    Success:
      type: object
      required: [success]
      properties:
        success: { type: boolean, const: true }
        payload: {}
    Error:
      type: object
      required: [success, message]
      properties:
        success: { type: boolean, const: false }
        code: { type: string, description: Stable snake_case error code; absent only on 500., example: team_full }
        message: { type: string, example: team is full }

    Health:
      type: object
      description: "The GET /health payload: uptime, open event streams, and this process's runtime and resource stats."
      required: [uptime_ms, streams, go_version, goroutines, gomaxprocs, num_cpu, cpu, memory]
      properties:
        uptime_ms: { type: integer, description: Milliseconds since the backend finished building. }
        streams: { type: integer, description: Open event streams, across all users. }
        go_version: { type: string, example: go1.26.0 }
        goroutines: { type: integer, description: Running goroutines. }
        gomaxprocs: { type: integer, description: runtime.GOMAXPROCS. }
        num_cpu: { type: integer, description: The host's logical CPUs. }
        cpu:
          type: object
          required: [process_seconds, load_average]
          properties:
            process_seconds: { type: number, description: The process's total user+system CPU time, in seconds. }
            load_average:
              type: object
              description: The host's 1/5/15-minute load averages (0 where unknown, e.g. not Linux).
              required: ["1", "5", "15"]
              properties:
                "1": { type: number }
                "5": { type: number }
                "15": { type: number }
        memory:
          type: object
          description: Go heap and OS resident memory, in bytes.
          required: [alloc, total_alloc, sys, heap_alloc, heap_objects, num_gc, gc_pause_total_ns, rss]
          properties:
            alloc: { type: integer, description: Bytes allocated and still in use. }
            total_alloc: { type: integer, description: Bytes allocated over the process's life. }
            sys: { type: integer, description: Bytes obtained from the OS. }
            heap_alloc: { type: integer, description: Alloc within the heap. }
            heap_objects: { type: integer, description: Live heap objects. }
            num_gc: { type: integer, description: Completed garbage collections. }
            gc_pause_total_ns: { type: integer, description: Total GC pause, in nanoseconds. }
            rss: { type: integer, description: Resident set size; 0 where unknown. }

    TokenResponse:
      type: object
      required: [access_token, token_type, expires_at, user]
      properties:
        access_token: { type: string, description: Ed25519-signed JWT. }
        token_type: { type: string, const: Bearer }
        expires_at: { type: string, format: date-time, description: Whole seconds; equals the token's exp. }
        user: { $ref: "#/components/schemas/User" }

    TeamOverview:
      type: object
      description: One team in the admin's teams list.
      required: [team, game]
      properties:
        team: { $ref: "#/components/schemas/Team" }
        game:
          description: Its game at a glance, or null for a team still in the lobby.
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/GameOverview"
    GameOverview:
      type: object
      description: What an admin needs to see about a team's game (the same values as its `team_state`).
      required: [health, knocked_out, bosses_defeated, boss, cooldown_class, qr_cooldowns, cast_count, powerups]
      properties:
        health: { type: integer, minimum: 0, example: 3 }
        knocked_out: { type: boolean, description: Health 0; it needs a revive. }
        bosses_defeated: { type: integer, minimum: 0, example: 2 }
        boss: { description: "As `team_state.boss`: serial, damage, phase_started_at, attacks, next_attack_at; null after the last boss." }
        cooldown_class: { type: ["string", "null"], description: The spell class it can't cast now, as `team_state.cooldown_class`., example: class_4 }
        qr_cooldowns: { type: array, items: { $ref: "#/components/schemas/QRCooldown" } }
        cast_count: { type: integer, minimum: 0, example: 7 }
        powerups: { $ref: "#/components/schemas/Powerups" }
    LeaderboardEntry:
      type: object
      description: One team's place on the leaderboard.
      required: [rank, team_id, name, bosses_defeated, last_defeat_at, damage, finished]
      properties:
        rank: { type: integer, minimum: 1, description: "Its place; every team has its own (ties break by team ID).", example: 1 }
        team_id: { type: string, example: "482913" }
        name: { type: string, example: Scanners }
        bosses_defeated: { type: integer, minimum: 0, description: The first key, more first., example: 4 }
        last_defeat_at: { type: ["string", "null"], format: date-time, description: "When its latest boss fell: the second key, earlier first; null if none has." }
        damage: { type: integer, minimum: 0, description: "Damage on its current boss: the third key, more first.", example: 120 }
        finished: { type: boolean, description: It defeated every boss (FINISHED). }
    LeaderboardBoard:
      type: object
      description: The top of the leaderboard.
      required: [top, teams]
      properties:
        top: { type: array, items: { $ref: "#/components/schemas/LeaderboardEntry" }, description: "The first `leaderboard.size` (10) teams, best first." }
        teams: { type: integer, minimum: 0, description: How many teams are ranked (started or finished)., example: 140 }
    LeaderboardMine:
      description: GET /api/leaderboard's answer.
      allOf:
        - $ref: "#/components/schemas/LeaderboardBoard"
        - type: object
          required: [me]
          properties:
            me:
              description: The caller's team's entry, or null if they have no started team.
              oneOf:
                - type: "null"
                - $ref: "#/components/schemas/LeaderboardEntry"
    LeaderboardEvent:
      type: object
      description: |
        The data of a `leaderboard` event, sent to every stream (game-wide); `message` is the top of the
        leaderboard. Types: `snapshot` (on connect), `updated` (the top changed: the server checks every
        `leaderboard.publish_every` (5 s) and broadcasts only on a change).
      required: [type, message]
      properties:
        type: { type: string, enum: [snapshot, updated] }
        message: { $ref: "#/components/schemas/LeaderboardBoard" }
    User:
      type: object
      required: [id, email, name, avatar_url, role, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email, example: player@snu.edu.in }
        name: { type: string, example: Player One }
        avatar_url: { type: [string, "null"], format: uri }
        role: { type: string, enum: [PLAYER, HELPER, ADMIN] }
        created_at: { type: string, format: date-time }

    Team:
      type: object
      required: [id, name, leader_id, status, created_at, started_at, members, version]
      properties:
        id: { type: string, pattern: "^[0-9]{6}$", description: The 6-digit join code., example: "482913" }
        name: { type: string, example: Scanners }
        leader_id: { type: string, format: uuid }
        status: { type: string, enum: [LOBBY, IN_GAME, FINISHED] }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        members:
          type: array
          description: In join order (decides who leads if the leader leaves).
          items: { $ref: "#/components/schemas/Member" }
        version: { $ref: "#/components/schemas/Version" }
    Member:
      type: object
      required: [id, name, avatar_url, is_ready, joined_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        avatar_url: { type: [string, "null"], format: uri }
        is_ready: { type: boolean }
        joined_at: { type: string, format: date-time }

    Game:
      type: object
      required: [shapes, health, locked_pattern_points, unlock_after_bosses, max_pattern_points, spell_classes, powerups]
      properties:
        shapes:
          type: array
          items: { $ref: "#/components/schemas/GameShape" }
        health: { type: integer, description: "game.health: every team's starting health, and what a revive restores.", example: 10 }
        locked_pattern_points:
          type: integer
          description: "game.locked_pattern_points: patterns of at least this many waypoints are locked until a team has defeated unlock_after_bosses bosses."
          example: 5
        unlock_after_bosses: { type: integer, description: "game.unlock_after_bosses.", example: 5 }
        max_pattern_points: { type: integer, description: "game.max_pattern_points: the most waypoints in any pattern.", example: 6 }
        spell_classes:
          type: array
          description: Every spell class, ascending by points. A pattern of n waypoints is in the class whose points is n.
          items: { $ref: "#/components/schemas/SpellClass" }
        powerups:
          type: object
          description: What each powerup does, from config.toml's [powerups].
          required: [damage_multiplier, heart, short_qr_cooldown_s, short_qr_window_s]
          properties:
            damage_multiplier: { type: number, minimum: 1, description: "What a damage_multiplier multiplies the next cast's damage by.", example: 2 }
            heart: { type: integer, minimum: 1, description: The health a heart gives back., example: 1 }
            short_qr_cooldown_s: { type: integer, minimum: 0, description: "Seconds a cast's waypoints cool while a short_qr_cooldown is active.", example: 120 }
            short_qr_window_s: { type: integer, minimum: 1, description: Seconds a short_qr_cooldown stays active., example: 300 }
    SpellClass:
      type: object
      description: >-
        A group of patterns by how many waypoints they have: every pattern of `points` waypoints, whatever its
        shape, is in this class. Static content (table `spell_class`), loaded once at startup.
      required: [id, name, points]
      properties:
        id: { type: string, description: The stable identifier, what casts carry as `class`., example: class_4 }
        name: { type: string, description: For display., example: Class 4 }
        points: { type: integer, minimum: 1, description: The waypoint count of its patterns., example: 4 }
    GameShape:
      type: object
      required: [id, name, patterns, points, damage, patterns_by_points, classes]
      properties:
        id: { type: string, description: What PUT …/selection takes., example: quadrilateral }
        name: { type: string, example: Quadrilateral }
        patterns: { type: integer, description: How many valid patterns the type has., example: 210 }
        points: { type: array, items: { type: integer }, description: Distinct pattern sizes, ascending., example: [4] }
        damage:
          type: object
          required: [min, max]
          description: Minimum and maximum damage across the type's patterns.
          properties:
            min: { type: integer, example: 195 }
            max: { type: integer, example: 278 }
        patterns_by_points:
          type: object
          additionalProperties: { type: integer }
          description: >-
            Its patterns counted by size (JSON keys are the sizes). A team can cast those of at most its
            `team_state.unlocked_points`.
          example: { "3": 12, "4": 6 }
        classes:
          type: array
          items: { type: string }
          description: The spell class of each of its sizes, in the same order as `points`.
          example: [class_3, class_4]

    TeamState:
      type: object
      required: [team_id, waypoints, patterns, shapes, selection, last_cast, stack, poisoned, bosses_defeated, boss, damage_multiplier, health, knocked_out, unlocked_points, locked_shapes, cooldown_class, cooldown_shapes, qr_cooldowns, cast_count, powerups, version]
      properties:
        team_id: { type: string, example: "482913" }
        waypoints: { type: array, items: { type: string }, description: Every waypoint ever accepted, sorted., example: ["2001", "2002"] }
        patterns:
          type: array
          description: Completed patterns, each as its sorted waypoint IDs.
          items: { type: array, items: { type: string } }
          example: [["2001", "2002", "2007", "2008"]]
        shapes: { type: array, items: { type: string }, description: Completed types., example: [quadrilateral] }
        selection:
          oneOf:
            - type: "null"
            - type: object
              required: [shape, selected_by, selected_at]
              properties:
                shape: { type: string, example: triangle }
                selected_by: { type: string, format: uuid }
                selected_at: { type: string, format: date-time }
        last_cast:
          description: >-
            The team's most recent cast (completed pattern), or null if it has none (casts before migration 0007
            aren't logged). Kept until the next cast: a new selection or a clear doesn't remove it. The full log
            is `GET /api/teams/me/casts`.
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Cast"
        stack:
          type: array
          description: >-
            The attempt's scans, bottom (oldest) first, until it casts or the team selects again. At most one is
            `wrong`, and it's always the top.
          items: { $ref: "#/components/schemas/StackScan" }
        poisoned:
          type: boolean
          description: A scan in the stack is wrong; scans are refused (`selection_poisoned`) until a reselect.
        bosses_defeated: { type: integer, minimum: 0, description: How many bosses the team has defeated., example: 1 }
        boss:
          description: >-
            The boss the team is fighting (by serial; its name, HP and asset are in `GET /api/game/bosses`) and
            the damage dealt to it so far, always below its HP. Null once every boss is defeated, or when no boss
            content is loaded.
          oneOf:
            - type: "null"
            - type: object
              required: [serial, damage, phase_started_at, attacks, next_attack_at]
              properties:
                serial: { type: integer, minimum: 1, example: 2 }
                damage: { type: integer, minimum: 0, example: 205 }
                phase_started_at:
                  type: string
                  format: date-time
                  description: When the team began fighting it (or was last revived); its attack clock counts from here.
                attacks: { type: integer, minimum: 0, description: How many times it has attacked this phase., example: 1 }
                next_attack_at:
                  type: ["string", "null"]
                  format: date-time
                  description: >-
                    When it attacks next (phase_started_at + (attacks + 1) × its attack_interval_s), or null if the
                    team is knocked out. Clients count down to it on the server's clock (`hello`).
        health:
          type: integer
          minimum: 0
          description: >-
            The team's health: `game.health` (10) at the start, less every boss attack. Derived from the boss phase
            and the clock, so it drops with nobody acting (`boss_attacked`).
          example: 9
        unlocked_points:
          type: integer
          description: >-
            The most waypoints a pattern the team can cast may have: `game.locked_pattern_points` − 1 (4) until it
            has defeated `game.unlock_after_bosses` (5) bosses, then `game.max_pattern_points` (6). A scan that could
            only grow into a bigger pattern is a wrong scan.
          example: 4
        locked_shapes:
          type: array
          items: { type: string }
          description: "Types the team can't select yet (`shape_locked`): every one of their patterns is bigger than `unlocked_points`."
          example: [hexagon]
        cooldown_class:
          type: [string, "null"]
          description: >-
            The spell class the team can't cast now: its last cast's class, until it casts a spell of another
            class. No pattern of it can be cast: a type made only of it can't be selected (`shape_on_cooldown`),
            and a scan that could only grow into one of its patterns is a wrong scan. Null before the first cast.
            Carries over boss defeats; rebuilt from the cast log on a restart.
          example: class_4
        cooldown_shapes:
          type: array
          items: { type: string }
          description: "Types the team can't select because of the cooldown (`shape_on_cooldown`): every one of their unlocked patterns is of `cooldown_class`. Never also in `locked_shapes`."
          example: [quadrilateral]
        qr_cooldowns:
          type: array
          items: { $ref: "#/components/schemas/QRCooldown" }
          description: >-
            The waypoints the team can't scan now (`waypoint_on_cooldown`): every waypoint of a spell it cast
            less than `game.qr_cooldown` (5 min) ago, sorted by `until`, then waypoint ID. Other waypoints
            stay open, and selecting isn't affected. An entry leaves at its `until`, with nobody acting
            (`qr_cooldown_ended`). Empty when none, or with `game.qr_cooldown` 0; rebuilt from the cast log on
            a restart.
        knocked_out:
          type: boolean
          description: >-
            Health is 0: selecting and scanning are refused (`knocked_out`) and nothing attacks until an admin
            revives the team (`POST /api/admin/teams/{team_id}/revive`).
        damage_multiplier:
          type: number
          exclusiveMinimum: 0
          description: >-
            What each cast's damage is multiplied by (then rounded) before it's dealt to the boss. 1 unless
            something sets it.
          example: 1
        cast_count:
          type: integer
          minimum: 0
          description: >-
            How many casts the team's log holds, repeats included. A client holding the log
            (`GET /api/teams/me/casts`) adds each new `last_cast` it sees; when `cast_count` is more than its
            log's length, it missed some (a reconnect) and re-fetches the log.
          example: 1
        powerups: { $ref: "#/components/schemas/Powerups" }
        version: { $ref: "#/components/schemas/Version" }
    PowerupKind:
      type: string
      enum: [damage_multiplier, heart, short_qr_cooldown, instant_cast]
      description: A kind of powerup (a temporary effect, not a spell).
    Powerups:
      type: object
      description: >-
        The team's powerups. `held`: the kinds it holds, at most one of each, in kind order. `active`: the effects
        running, in kind order: a `damage_multiplier` (until null: used up by the next cast) and a
        `short_qr_cooldown` (until its window ends, then it leaves with `powerup_ended`). A heart or an instant
        cast takes effect at once, so never shows in `active`. Rebuilt from the database and the clock on a
        restart.
      required: [held, active]
      properties:
        held: { type: array, items: { $ref: "#/components/schemas/PowerupKind" }, example: [heart] }
        active:
          type: array
          items:
            type: object
            required: [kind, until]
            properties:
              kind: { $ref: "#/components/schemas/PowerupKind" }
              until: { type: ["string", "null"], format: date-time, description: "When it stops; null for a damage_multiplier." }
          example: [{kind: short_qr_cooldown, until: "2026-10-17T12:05:00Z"}]
    Cast:
      type: object
      required: [pattern, shape, class, cast_by, cast_at, already_completed, damage, dealt, boss, defeated_boss, instant, boosted, short_qr_cooldown]
      properties:
        pattern: { type: array, items: { type: string }, description: The cast pattern's waypoint IDs, sorted., example: ["2001", "2002", "2007", "2008"] }
        shape: { type: string, description: The pattern's type., example: quadrilateral }
        class: { type: string, description: "The pattern's spell class ID: the class of its waypoint count (`SpellClass`).", example: class_4 }
        cast_by: { type: string, format: uuid, description: The member whose scan completed the pattern. }
        cast_at: { type: string, format: date-time, description: When (the completing scan's time). }
        already_completed: { type: boolean, description: The team had cast this pattern before, so its progress didn't grow. }
        damage: { type: integer, description: "What the cast spell deals: the pattern's damage.", example: 274 }
        dealt:
          type: integer
          minimum: 0
          description: >-
            The damage it dealt to a boss: `damage` × the team's multiplier at the time, rounded. 0 if every boss
            was already defeated (or for casts from before bosses existed). A cast that defeats a boss loses the
            rest: it never carries to the next boss.
          example: 274
        boss: { type: ["integer", "null"], description: The serial of the boss it hit, or null if none., example: 1 }
        defeated_boss: { type: boolean, description: This cast defeated that boss. }
        instant: { type: boolean, description: "An instant_cast powerup cast it, with no scans (cast_by is the leader)." }
        boosted: { type: boolean, description: "A damage_multiplier powerup multiplied `dealt`." }
        short_qr_cooldown: { type: boolean, description: "A short_qr_cooldown powerup was active: its waypoints cool for `powerups.short_qr_cooldown`." }
    Boss:
      type: object
      required: [serial, name, asset, description, hp, attack_interval_s, attack_damage]
      properties:
        serial: { type: integer, minimum: 1, description: "Its place in the sequence: 1 is fought first.", example: 1 }
        name: { type: string, example: Matthew Patel }
        asset: { type: string, description: "A key the frontend resolves to the boss's image; not a URL.", example: bosses/1.png }
        description: { type: string }
        hp: { type: integer, minimum: 1, description: The damage a team must deal to defeat it., example: 200 }
        attack_interval_s:
          type: integer
          minimum: 1
          description: >-
            How often it attacks, in seconds of a team's phase against it. From config.toml
            (game.boss_attack.interval, the same for every boss), not the boss table.
          example: 600
        attack_damage:
          type: integer
          minimum: 0
          description: >-
            What each attack takes off the team's health. From config.toml (game.boss_attack.damage, by serial;
            for now each boss does its serial number), not the boss table.
          example: 1
    StackScan:
      type: object
      required: [waypoint_id, user_id, scanned_at, wrong]
      properties:
        waypoint_id: { type: string, example: "2001" }
        user_id: { type: string, format: uuid }
        scanned_at: { type: string, format: date-time }
        wrong: { type: boolean, description: "The waypoint, with the scans below it, can't be part of any pattern of the selected type: it poisons the attempt." }

    ScanResult:
      type: object
      required: [outcome, state]
      properties:
        outcome:
          type: string
          enum: [scan_added, wrong_scan, pattern_completed]
          description: "`wrong_scan`: pushed, but it doesn't match any pattern of the selected type; tell the player and offer a restart."
        pattern: { type: array, items: { type: string }, description: Set on pattern_completed., example: ["2001", "2002", "2007", "2008"] }
        already_completed: { type: boolean, description: The pattern had been completed before, so progress didn't grow. }
        state: { $ref: "#/components/schemas/TeamState" }

    SigningKey:
      type: object
      required: [waypoint_id, key, rotate_ms, window_ms, server_time]
      properties:
        waypoint_id: { type: string, pattern: "^[0-9]{4}$", example: "2001" }
        key: { type: string, description: "The waypoint-scoped HMAC key, hex-encoded (32 bytes)." }
        rotate_ms: { type: integer, description: How often the display signs a fresh token (qr.rotate), in milliseconds., example: 5000 }
        window_ms: { type: integer, description: "How long each token is valid: qr.rotate + qr.tolerance, in milliseconds.", example: 10000 }
        server_time: { type: integer, description: The backend's clock in whole seconds, to correct the display's own clock., example: 1760000000 }
    QRVerify:
      type: object
      required: [waypoint_id]
      properties:
        waypoint_id: { type: string, pattern: "^[0-9]{4}$", description: The waypoint the verified token stands for., example: "2001" }
