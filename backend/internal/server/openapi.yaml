openapi: 3.1.0
info:
  title: Labyrinth 26 API
  version: "0.1.0"
  description: |
    The Labyrinth 26 backend: a campus game where teams scan waypoints to trace shapes.

    **Envelope.** Every JSON response is `{"success", "code"?, "message"?, "payload"?}`.
    Errors carry a stable snake_case `code` the client switches on; only `500` has none.

    **Auth.** Routes under `/api` need `Authorization: Bearer <JWT>`. The JWT is an Ed25519
    (`EdDSA`) token from `POST /auth/token`, valid for `auth.token_ttl` (config.toml, 12 h).

    **Limits.** Request bodies over `server.max_body_bytes` (1 MiB) get `400 invalid_body`.
    Unknown paths get 404 `not_found`, wrong methods 405 `method_not_allowed`, both as envelopes.

    **Live updates** come over one server-sent event stream per user at `GET /api/events`, which also
    accepts the `labyrinth_token` cookie (a browser's EventSource can't send headers; the frontend and
    backend share a domain, so the browser sends it). The cookie is accepted on this route only.

    ⚠ `POST /api/teams/me/state/scans` takes the raw 4-digit waypoint ID until QR verification exists.

    This file is checked against the code by `TestOpenAPIMatchesRoutes` (internal/server):
    every registered route and every error code must appear here, with codes listed
    in each response's description.
servers:
  - url: http://localhost:3000
    description: local dev backend
tags:
  - name: health
  - name: auth
    description: Google sign-in and tokens (see internal/auth/README.md)
  - name: user
  - name: teams
    description: Forming a team and starting the game (see internal/teams/README.md)
  - name: game
    description: Selecting a type and scanning (see internal/teamstate/README.md)
  - name: live
    description: Server-sent events

security:
  - bearer: []

paths:
  /healthz:
    get:
      tags: [health]
      summary: Health check
      description: 200 if Postgres is reachable, with the number of open event streams.
      security: []
      responses:
        "200":
          description: Healthy.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - properties:
                      payload:
                        type: object
                        required: [streams]
                        properties:
                          streams: { type: integer, example: 42 }
        "503":
          description: Database unreachable (no code).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/google/login:
    get:
      tags: [auth]
      summary: Start Google sign-in
      description: |
        Sets a signed, HttpOnly state cookie (valid `auth.oauth_state_ttl`, 10 m) and redirects to
        Google with PKCE. The browser opens this directly.
      security: []
      parameters:
        - name: next
          in: query
          description: Same-site path to return to after sign-in; anything else becomes `/`.
          schema: { type: string, example: /team }
      responses:
        "302":
          description: Redirect to Google's consent screen.
          headers:
            Location: { schema: { type: string } }
            Set-Cookie: { schema: { type: string }, description: "labyrinth_oauth_state=…; Path=/auth/google; HttpOnly; SameSite=Lax" }

  /auth/google/callback:
    get:
      tags: [auth]
      summary: Google redirect target
      description: |
        Verifies the state and Google's ID token, signs the user in, and redirects to the frontend:
        `FRONTEND_URL/auth/callback?code=<login code>&next=<path>` on success (the code is single-use,
        valid `auth.login_code_ttl`, 2 m), or `FRONTEND_URL/auth/error?reason=<reason>` on failure.
      security: []
      parameters:
        - { name: state, in: query, schema: { type: string } }
        - { name: code, in: query, schema: { type: string } }
        - { name: error, in: query, description: Set by Google, e.g. access_denied, schema: { type: string } }
      responses:
        "302":
          description: |
            Redirect to the frontend. Failure `reason`s: `state_missing`, `state_invalid`, `state_mismatch`,
            `google_<error>` (e.g. `google_access_denied`), `code_missing`, `google_exchange_failed`,
            `email_unverified`, `email_domain_not_allowed`, `email_in_use`, `internal_error`.
          headers:
            Location: { schema: { type: string } }

  /auth/token:
    post:
      tags: [auth]
      summary: Redeem a login code for an access token
      description: |
        Called server to server by the SvelteKit app. The code is used up only if the token is issued,
        so a failure here can be retried with the same code.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              additionalProperties: false
              properties:
                code: { type: string, example: "Zk3…base64url" }
      responses:
        "200":
          description: Token issued.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - properties:
                      payload: { $ref: "#/components/schemas/TokenResponse" }
        "400":
          $ref: "#/components/responses/Error"
          description: "Codes: `invalid_body`, `invalid_code`"
        "404":
          $ref: "#/components/responses/Error"
          description: "Codes: `user_not_found`"

  /api/me:
    get:
      tags: [user]
      summary: The signed-in user
      description: Read from the database, so the role is current even if it changed since sign-in.
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - properties:
                      payload: { $ref: "#/components/schemas/User" }
        "401":
          $ref: "#/components/responses/Error"
          description: "Codes: `missing_token`, `invalid_token`, `user_not_found`"

  /api/teams/me:
    get:
      tags: [teams]
      summary: Your team
      responses:
        "200": { $ref: "#/components/responses/Team" }
        "401": { $ref: "#/components/responses/Unauthorized", description: "Codes: `missing_token`, `invalid_token`" }
        "404": { $ref: "#/components/responses/Error", description: "Codes: `not_in_team`" }

  /api/teams:
    post:
      tags: [teams]
      summary: Create a team
      description: You become its leader. The name is trimmed and must be 1 to `teams.name_max_length` (32) characters, no control characters.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name: { type: string, example: Scott Pilgrim's Fan Club }
      responses:
        "201": { $ref: "#/components/responses/Team" }
        "400": { $ref: "#/components/responses/Error", description: "Codes: `invalid_body`, `invalid_team_name`" }
        "401": { $ref: "#/components/responses/Unauthorized", description: "Codes: `missing_token`, `invalid_token`" }
        "409": { $ref: "#/components/responses/Error", description: "Codes: `already_in_team`" }

  /api/teams/join:
    post:
      tags: [teams]
      summary: Join a team by its code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [team_id]
              additionalProperties: false
              properties:
                team_id: { type: string, pattern: "^[0-9]{6}$", example: "482913" }
      responses:
        "200": { $ref: "#/components/responses/Team" }
        "400": { $ref: "#/components/responses/Error", description: "Codes: `invalid_body`, `invalid_team_id`" }
        "401": { $ref: "#/components/responses/Unauthorized", description: "Codes: `missing_token`, `invalid_token`" }
        "404": { $ref: "#/components/responses/Error", description: "Codes: `team_not_found`" }
        "409": { $ref: "#/components/responses/Error", description: "Codes: `already_in_team`, `team_full`, `team_locked`" }

  /api/teams/leave:
    post:
      tags: [teams]
      summary: Leave your team (lobby only)
      description: If the leader leaves, the earliest remaining member becomes leader. The last member leaving deletes the team.
      responses:
        "200":
          description: Left. No payload.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
        "401": { $ref: "#/components/responses/Unauthorized", description: "Codes: `missing_token`, `invalid_token`" }
        "404": { $ref: "#/components/responses/Error", description: "Codes: `not_in_team`" }
        "409": { $ref: "#/components/responses/Error", description: "Codes: `team_locked`" }

  /api/teams/me/ready:
    put:
      tags: [teams]
      summary: Set your ready flag (non-leaders, lobby only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ready]
              additionalProperties: false
              properties:
                ready: { type: boolean }
      responses:
        "200": { $ref: "#/components/responses/Team" }
        "400": { $ref: "#/components/responses/Error", description: "Codes: `invalid_body`" }
        "401": { $ref: "#/components/responses/Unauthorized", description: "Codes: `missing_token`, `invalid_token`" }
        "404": { $ref: "#/components/responses/Error", description: "Codes: `not_in_team`" }
        "409": { $ref: "#/components/responses/Error", description: "Codes: `team_locked`, `leader_cannot_ready`" }

  /api/teams/me/start:
    post:
      tags: [teams]
      summary: Start the game (leader only)
      description: Any size from 1 to `teams.size` (6) may start, once every non-leader is ready. `LOBBY` → `IN_GAME`; the roster is then frozen. Every member's event stream gets the `IN_GAME` `team`, then the team's empty `team_state`.
      responses:
        "200": { $ref: "#/components/responses/Team" }
        "401": { $ref: "#/components/responses/Unauthorized", description: "Codes: `missing_token`, `invalid_token`" }
        "403": { $ref: "#/components/responses/Error", description: "Codes: `not_leader`" }
        "404": { $ref: "#/components/responses/Error", description: "Codes: `not_in_team`" }
        "409": { $ref: "#/components/responses/Error", description: "Codes: `team_locked`, `not_all_ready`" }

  /api/game/shapes:
    get:
      tags: [game]
      summary: Pattern types to pick
      description: The shapes ("types" on the client) a team can select. There's no time limit, so no timing rules.
      responses:
        "200":
          description: Shapes.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - properties:
                      payload: { $ref: "#/components/schemas/Game" }
        "401": { $ref: "#/components/responses/Unauthorized", description: "Codes: `missing_token`, `invalid_token`" }

  /api/teams/me/state:
    get:
      tags: [game]
      summary: Your team's game state
      responses:
        "200": { $ref: "#/components/responses/TeamState" }
        "401": { $ref: "#/components/responses/Unauthorized", description: "Codes: `missing_token`, `invalid_token`" }
        "404": { $ref: "#/components/responses/Error", description: "Codes: `not_in_team`" }

  /api/teams/me/casts:
    get:
      tags: [game]
      summary: Your team's cast log
      description: >-
        Every pattern your team has completed, repeats included (`already_completed`), newest first. Read from
        memory (the `team_cast` table, loaded at startup). Not pushed on the stream: `team_state.last_cast`
        carries each new cast, so a client loads this once and prepends each new `last_cast` it sees.
      responses:
        "200":
          description: The cast log, newest first; empty before the first cast.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - properties:
                      payload:
                        type: array
                        items: { $ref: "#/components/schemas/Cast" }
        "401": { $ref: "#/components/responses/Unauthorized", description: "Codes: `missing_token`, `invalid_token`" }
        "404": { $ref: "#/components/responses/Error", description: "Codes: `not_in_team`" }

  /api/teams/me/state/selection:
    put:
      tags: [game]
      summary: Select a pattern type
      description: Any member may select. **Always purges the team's scan stack**, reselecting the same type included, so reselecting is how a team restarts a poisoned attempt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shape]
              additionalProperties: false
              properties:
                shape: { type: string, example: square }
      responses:
        "200": { $ref: "#/components/responses/TeamState" }
        "400": { $ref: "#/components/responses/Error", description: "Codes: `invalid_body`" }
        "401": { $ref: "#/components/responses/Unauthorized", description: "Codes: `missing_token`, `invalid_token`" }
        "404": { $ref: "#/components/responses/Error", description: "Codes: `unknown_shape`, `not_in_team`" }
        "409": { $ref: "#/components/responses/Error", description: "Codes: `not_in_game`" }
    delete:
      tags: [game]
      summary: Give up the selection
      description: Clears the selection and purges the stack. A no-op 200 if nothing is selected.
      responses:
        "200": { $ref: "#/components/responses/TeamState" }
        "401": { $ref: "#/components/responses/Unauthorized", description: "Codes: `missing_token`, `invalid_token`" }
        "404": { $ref: "#/components/responses/Error", description: "Codes: `not_in_team`" }
        "409": { $ref: "#/components/responses/Error", description: "Codes: `not_in_game`" }

  /api/teams/me/state/scans:
    post:
      tags: [game]
      summary: Scan a waypoint
      description: |
        No time limit, and any member may scan any number of the pattern's waypoints. Rejected **without being
        pushed** if no type is selected (`no_shape_selected`), the attempt is poisoned (`selection_poisoned`:
        reselect to restart), or the waypoint is already in the stack (`waypoint_already_scanned`, a retry
        included). A scan whose waypoint, with the stack, can't be part of any pattern of the selected type is
        pushed **marked `wrong`**, with outcome `wrong_scan`: the attempt is poisoned (`poisoned: true`) until
        someone reselects. Once the stack is exactly a pattern of the selected type, it completes (a cast,
        logged in `team_cast`): the stack and selection are purged and `last_cast` is set.

        ⚠ Takes the raw waypoint ID; to be replaced by QR verification.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [waypoint_id]
              additionalProperties: false
              properties:
                waypoint_id: { type: string, pattern: "^[0-9]{4}$", example: "1007" }
      responses:
        "200":
          description: Accepted.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - properties:
                      payload: { $ref: "#/components/schemas/ScanResult" }
        "400": { $ref: "#/components/responses/Error", description: "Codes: `invalid_body`" }
        "401": { $ref: "#/components/responses/Unauthorized", description: "Codes: `missing_token`, `invalid_token`" }
        "404": { $ref: "#/components/responses/Error", description: "Codes: `unknown_waypoint`, `not_in_team`" }
        "409":
          $ref: "#/components/responses/Error"
          description: "Codes: `not_in_game`, `no_shape_selected`, `selection_poisoned`, `waypoint_already_scanned`"

  /api/events:
    get:
      tags: [live]
      summary: Live event stream (server-sent events)
      security:
        - bearer: []
        - tokenCookie: []
      description: |
        `text/event-stream`, the caller's one stream: it carries events of every scope (the user's own, their
        team's, and game-wide). On connect: a `retry:` line (a random reconnect delay between `live.retry_min`
        and `live.retry_max`, 1–6 s, so a restart doesn't bring every client back at once), then `hello`, then
        `team` (or `no_team`), then `team_state` if you're in a team, then game-wide resources (none yet). Then
        one event per change, each a full snapshot (never a diff), and a `: ping` comment after
        `live.heartbeat` (25 s) with no event. A client that falls `live.subscriber_buffer` (16) events behind,
        or can't take a write within `live.write_timeout` (10 s), is dropped and should reconnect (EventSource
        does this itself); the first events after a reconnect are full snapshots.

        Nobody subscribes to channels: the server routes each event by user ID, to one user, to a team's
        current members, or to every stream.

        `team_state` is published to every member when the leader starts (the empty state, right after the
        `IN_GAME` `team`), and after every accepted selection, clear, scan (wrong ones included) and cast.
        Nothing changes with time alone. It carries `last_cast`, the team's newest cast (the full log is
        `GET /api/teams/me/casts`). Rejections and no-ops publish nothing. The full reference (every
        trigger, ordering, heartbeat, reconnection, and what clients must do) is
        `backend/internal/server/README.md`, "The event stream".

        Game-wide events (quizzes, quick-time events; none yet) will each carry `null` when nothing is active,
        or an object with at least an `id`. Their schemas are not final.

        | event | scope | data |
        |---|---|---|
        | `hello` | stream | `Hello` |
        | `team` | team | `Team` |
        | `no_team` | user | `{}` |
        | `team_state` | team | `TeamState` |

        ```
        retry: 3412

        event: hello
        data: {"server_time":"2026-10-18T12:00:00.123456Z"}

        event: team
        data: {"id":"482913","name":"Scanners",…}

        event: team_state
        data: {"team_id":"482913","waypoints":[],"patterns":[],"shapes":[],"selection":null,"last_cast":null,"stack":[],"poisoned":false}

        : ping
        ```
      responses:
        "200":
          description: The stream.
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized", description: "Codes: `missing_token`, `invalid_token`" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT (EdDSA)
    tokenCookie:
      type: apiKey
      in: cookie
      name: labyrinth_token
      description: The access token in the SvelteKit app's httpOnly cookie. Accepted only by `GET /api/events`.

  responses:
    Error:
      description: |
        A rule or input error. Each use lists the `code`s it can carry.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing (`missing_token`) or invalid/expired (`invalid_token`) bearer token. Sets `WWW-Authenticate`.
      headers:
        WWW-Authenticate: { schema: { type: string, example: 'Bearer error="invalid_token"' } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Team:
      description: The team after the change.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Success"
              - properties:
                  payload: { $ref: "#/components/schemas/Team" }
    TeamState:
      description: The team's game state after the change.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Success"
              - properties:
                  payload: { $ref: "#/components/schemas/TeamState" }

  schemas:
    Hello:
      type: object
      description: |
        The first event on every stream, and the canonical clock for clients. On each one, so on every
        connect, a client re-measures its offset: server_time minus its own monotonic clock. Anything a
        client shows relative to now ("scanned 2 min ago", a future countdown) uses it, so every phone agrees.
        The game has no time limit; clients never decide state from time. Carries nothing else.
      required: [server_time]
      properties:
        server_time: { type: string, format: date-time, description: The server's clock when the stream opened, UTC. }
    Success:
      type: object
      required: [success]
      properties:
        success: { type: boolean, const: true }
        payload: {}
    Error:
      type: object
      required: [success, message]
      properties:
        success: { type: boolean, const: false }
        code: { type: string, description: Stable snake_case error code; absent only on 500., example: team_full }
        message: { type: string, example: team is full }

    TokenResponse:
      type: object
      required: [access_token, token_type, expires_at, user]
      properties:
        access_token: { type: string, description: Ed25519-signed JWT. }
        token_type: { type: string, const: Bearer }
        expires_at: { type: string, format: date-time, description: Whole seconds; equals the token's exp. }
        user: { $ref: "#/components/schemas/User" }

    User:
      type: object
      required: [id, email, name, avatar_url, role, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email, example: player@snu.edu.in }
        name: { type: string, example: Player One }
        avatar_url: { type: [string, "null"], format: uri }
        role: { type: string, enum: [PLAYER, HELPER, ADMIN] }
        created_at: { type: string, format: date-time }

    Team:
      type: object
      required: [id, name, leader_id, status, created_at, started_at, members]
      properties:
        id: { type: string, pattern: "^[0-9]{6}$", description: The 6-digit join code., example: "482913" }
        name: { type: string, example: Scanners }
        leader_id: { type: string, format: uuid }
        status: { type: string, enum: [LOBBY, IN_GAME, FINISHED] }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        members:
          type: array
          description: In join order (decides who leads if the leader leaves).
          items: { $ref: "#/components/schemas/Member" }
    Member:
      type: object
      required: [id, name, avatar_url, is_ready, joined_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        avatar_url: { type: [string, "null"], format: uri }
        is_ready: { type: boolean }
        joined_at: { type: string, format: date-time }

    Game:
      type: object
      required: [shapes, max_pattern_points]
      properties:
        shapes:
          type: array
          items: { $ref: "#/components/schemas/GameShape" }
        max_pattern_points: { type: integer, description: "game.max_pattern_points: the most waypoints in any pattern.", example: 6 }
    GameShape:
      type: object
      required: [id, name, patterns, points, damage]
      properties:
        id: { type: string, description: What PUT …/selection takes., example: square }
        name: { type: string, example: Square }
        patterns: { type: integer, description: How many valid patterns the type has., example: 18 }
        points: { type: array, items: { type: integer }, description: Distinct pattern sizes, ascending., example: [4] }
        damage:
          type: object
          required: [min, max]
          description: Minimum and maximum damage across the type's patterns.
          properties:
            min: { type: integer, example: 87 }
            max: { type: integer, example: 125 }

    TeamState:
      type: object
      required: [team_id, waypoints, patterns, shapes, selection, last_cast, stack, poisoned]
      properties:
        team_id: { type: string, example: "482913" }
        waypoints: { type: array, items: { type: string }, description: Every waypoint ever accepted, sorted., example: ["1001", "1002"] }
        patterns:
          type: array
          description: Completed patterns, each as its sorted waypoint IDs.
          items: { type: array, items: { type: string } }
          example: [["1001", "1002", "1007", "1008"]]
        shapes: { type: array, items: { type: string }, description: Completed types., example: [square] }
        selection:
          oneOf:
            - type: "null"
            - type: object
              required: [shape, selected_by, selected_at]
              properties:
                shape: { type: string, example: triangle }
                selected_by: { type: string, format: uuid }
                selected_at: { type: string, format: date-time }
        last_cast:
          description: >-
            The team's most recent cast (completed pattern), or null if it has none (casts before migration 0007
            aren't logged). Kept until the next cast: a new selection or a clear doesn't remove it. The full log
            is `GET /api/teams/me/casts`.
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Cast"
        stack:
          type: array
          description: >-
            The attempt's scans, bottom (oldest) first, until it casts or the team selects again. At most one is
            `wrong`, and it's always the top.
          items: { $ref: "#/components/schemas/StackScan" }
        poisoned:
          type: boolean
          description: A scan in the stack is wrong; scans are refused (`selection_poisoned`) until a reselect.
    Cast:
      type: object
      required: [pattern, shape, cast_by, cast_at, already_completed, damage]
      properties:
        pattern: { type: array, items: { type: string }, description: The cast pattern's waypoint IDs, sorted., example: ["1001", "1002", "1007", "1008"] }
        shape: { type: string, description: The pattern's type., example: square }
        cast_by: { type: string, format: uuid, description: The member whose scan completed the pattern. }
        cast_at: { type: string, format: date-time, description: When (the completing scan's time). }
        already_completed: { type: boolean, description: The team had cast this pattern before, so its progress didn't grow. }
        damage: { type: integer, description: What the cast spell deals., example: 107 }
    StackScan:
      type: object
      required: [waypoint_id, user_id, scanned_at, wrong]
      properties:
        waypoint_id: { type: string, example: "1001" }
        user_id: { type: string, format: uuid }
        scanned_at: { type: string, format: date-time }
        wrong: { type: boolean, description: "The waypoint, with the scans below it, can't be part of any pattern of the selected type: it poisons the attempt." }

    ScanResult:
      type: object
      required: [outcome, state]
      properties:
        outcome:
          type: string
          enum: [scan_added, wrong_scan, pattern_completed]
          description: "`wrong_scan`: pushed, but it doesn't match any pattern of the selected type; tell the player and offer a restart."
        pattern: { type: array, items: { type: string }, description: Set on pattern_completed., example: ["1001", "1002", "1007", "1008"] }
        already_completed: { type: boolean, description: The pattern had been completed before, so progress didn't grow. }
        state: { $ref: "#/components/schemas/TeamState" }
