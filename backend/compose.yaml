# Local Postgres for development: docker compose up -d
# Host port defaults to 5432; set POSTGRES_PORT in .env to change it (and the
# port in DATABASE_URL with it).
name: labyrinth-26

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: labyrinth
      POSTGRES_PASSWORD: labyrinth
      POSTGRES_DB: labyrinth
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labyrinth"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
