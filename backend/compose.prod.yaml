# Production: the backend and its Postgres on one Docker host.
#
#   docker compose -f compose.prod.yaml up -d --build     # start, or deploy a new version
#   docker compose -f compose.prod.yaml logs -f backend   # one line per request
#   docker compose -f compose.prod.yaml ps                # health of both
#
# Secrets come from .env next to this file (see .env.example), plus
# POSTGRES_PASSWORD (URL-safe: openssl rand -hex 24). DATABASE_URL and PORT in
# .env are ignored: they're set below for the container.
#
# Both services restart whenever they exit (a crash, a lost instance lock, the
# host rebooting), with no retry cap: a backend that starts while the old
# one's lock is still held refuses, exits, and succeeds a retry later. Docker
# waits longer between each retry (doubling, up to a minute), so after a long
# Postgres outage the backend may take up to a minute to come back.
#
# Exactly one backend: never scale this service. A deploy (up -d --build)
# stops the old container before starting the new one, as it must.
#
# Nothing is published on the host: both live on the "labyrinth" network,
# where the backend is http://backend:3000 and Postgres postgres:5432. A
# reverse proxy or the frontend joins that network to reach the backend
# (another compose file: networks: { labyrinth: { external: true } }).
# psql and pg_dump run inside the Postgres container:
#   docker compose -f compose.prod.yaml exec postgres psql -U labyrinth
name: labyrinth-26-prod

networks:
  labyrinth:
    name: labyrinth

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: labyrinth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: labyrinth
    networks: [labyrinth]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labyrinth"]
      interval: 2s
      timeout: 3s
      retries: 15

  backend:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://labyrinth:${POSTGRES_PASSWORD}@postgres:5432/labyrinth?sslmode=disable
      PORT: "3000"
    networks: [labyrinth]
    depends_on:
      postgres:
        condition: service_healthy
        restart: true # restarting Postgres through compose restarts the backend too
    # One open file per event stream: 10,000 players need well over the
    # default 1,024.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # SIGTERM, then up to server.shutdown_timeout (10 s) to finish requests,
    # before Docker kills it.
    stop_grace_period: 20s
    # Marks the container unhealthy (shown in ps) when /health fails,
    # including while Postgres is unreachable. Docker doesn't restart on it:
    # watch it from outside and alert.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

volumes:
  pgdata:
