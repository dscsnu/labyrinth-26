# Production: the backend, its Postgres and Caddy on one Docker host. The host
# needs only this file and a .env next to it: the backend and Caddy come from
# Artifact Registry (images built from this repository), never built here.
#
#   docker compose -f compose.prod.yaml pull      # fetch IMAGE_TAG's images
#   docker compose -f compose.prod.yaml up -d     # start, or deploy a new version
#   docker compose -f compose.prod.yaml ps        # backend and postgres (healthy), caddy Up
#   docker compose -f compose.prod.yaml logs -f backend   # one line per request
#
# .env holds every setting, written from Secret Manager (the labyrinth-*
# secrets; see backend/README.md, "Deploying"), plus IMAGE_TAG: the version to
# run. Compose reads it on its own: it fills the ${...} below (a missing value
# stops compose, naming it) and is the backend's environment. DATABASE_URL,
# PORT, PUBLIC_URL and FRONTEND_URL are set below, not read from it.
#
# Every service restarts whenever they exit (a crash, a lost instance lock, the
# host rebooting), with no retry cap: a backend that starts while the old
# one's lock is still held refuses, exits, and succeeds a retry later. Docker
# waits longer between each retry (doubling, up to a minute), so after a long
# Postgres outage the backend may take up to a minute to come back.
#
# Exactly one backend: never scale this service. A deploy (up -d with a new
# IMAGE_TAG) stops the old container before starting the new one, as it must.
#
# Only Caddy is published on the host (80 and 443): it serves HTTPS for
# FRONTEND_HOST (the frontend, plus /api/events to the backend) and
# BACKEND_HOST (every backend route); see caddy/Caddyfile in the repository. Two networks:
# "labyrinth", where the backend is http://backend:3000 and which Caddy and
# the frontend join (as services in this file, or from another compose file:
# networks: { labyrinth: { external: true } }); and "db", internal, where
# only the backend reaches Postgres (postgres:5432). Nothing on "labyrinth"
# can reach Postgres, and Postgres has no route out.
# psql and pg_dump run inside the Postgres container:
#   docker compose -f compose.prod.yaml exec postgres psql -U labyrinth
name: labyrinth-26-prod

# Every container's logs, rotated: 100 MB files, the oldest deleted once there
# are 50, so at most 5 GB each (less on disk: rotated files are compressed).
# At 10,000 players the backend writes about a line per request, which
# unrotated would grow until the disk (shared with Postgres) filled. Once the
# cap is reached the oldest lines go; a new container (a deploy, or down) starts
# a fresh log, a restart keeps it. Non-blocking: if writing ever falls behind,
# lines are dropped rather than the backend stalling on stdout.
x-logging: &logging
  driver: local
  options:
    max-size: "100m"
    max-file: "50"
    mode: non-blocking
    max-buffer-size: "4m"

networks:
  labyrinth:
    name: labyrinth
  db:
    internal: true # no route out, and only the services below on it

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: labyrinth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: labyrinth
    networks: [db]
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Sized for the c4-standard-4 (4 vCPU, 15 GB) it shares with the backend
    # and frontend: a ~5 GB budget. Most are ceilings, not allocations:
    # shared_buffers fills only as data is read, so with the game's small
    # database Postgres should stay under ~1 GB. effective_cache_size only
    # informs the planner. SSD-backed disk: random_page_cost and
    # effective_io_concurrency say so. synchronous_commit stays on: the
    # backend reloads from Postgres on restart, so a lost commit would undo
    # players' actions. Confirm under load (docker stats) before game day.
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=6GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_connections=50
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - max_wal_size=2GB
    # Docker's 64 MB /dev/shm can fail parallel queries ("could not resize
    # shared memory segment").
    shm_size: 256mb
    # Room for the shutdown checkpoint: Docker's default 10 s would kill it
    # mid-checkpoint, and the next start would run crash recovery.
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labyrinth"]
      interval: 2s
      timeout: 3s
      retries: 15

  backend:
    image: asia-south2-docker.pkg.dev/labyrinth-gdg-2026/labyrinth/backend:${IMAGE_TAG:?set IMAGE_TAG in .env}
    restart: unless-stopped
    logging: *logging
    env_file: .env
    environment:
      # The public URLs, from the same hosts Caddy serves: each domain is set
      # once, in .env.
      PUBLIC_URL: https://${BACKEND_HOST:?set BACKEND_HOST in .env}
      FRONTEND_URL: https://${FRONTEND_HOST:?set FRONTEND_HOST in .env}
      # pool_max_conns: pgx's default is the CPU count (min 4), so 4 on the
      # c4-standard-4. 16 leaves room for write bursts, well under
      # Postgres's max_connections (50).
      DATABASE_URL: postgres://labyrinth:${POSTGRES_PASSWORD}@postgres:5432/labyrinth?sslmode=disable&pool_max_conns=16
      PORT: "3000"
    # Least privilege: the image already runs as uid 10001; here it also
    # gets a read-only filesystem (it writes no files), no Linux
    # capabilities, and no way to gain any (setuid binaries included).
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [labyrinth, db]
    depends_on:
      postgres:
        condition: service_healthy
        restart: true # restarting Postgres through compose restarts the backend too
    # One open file per event stream: 10,000 players need well over the
    # default 1,024.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # SIGTERM, then up to server.shutdown_timeout (10 s) to finish requests,
    # before Docker kills it.
    stop_grace_period: 20s
    # Marks the container unhealthy (shown in ps) when /health fails,
    # including while Postgres is unreachable. Docker doesn't restart on it:
    # watch it from outside and alert.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  caddy:
    # The official Caddy with caddy/Caddyfile baked in (caddy/Dockerfile).
    image: asia-south2-docker.pkg.dev/labyrinth-gdg-2026/labyrinth/caddy:${IMAGE_TAG:?set IMAGE_TAG in .env}
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      FRONTEND_HOST: ${FRONTEND_HOST:?set FRONTEND_HOST in .env}
      BACKEND_HOST: ${BACKEND_HOST:?set BACKEND_HOST in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      # The certificates. Must persist: Let's Encrypt allows only 5 duplicate
      # certificates a week, so losing them on every recreate could leave the
      # site without HTTPS for days.
      - caddy_data:/data
      - caddy_config:/config
    networks: [labyrinth]
    depends_on: [backend]
    # Each event stream holds two connections through Caddy (phone side and
    # backend side): 10,000 players need about 20,000 open files.
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
    # Least privilege: only what binding 80/443 needs, and a read-only root
    # (state lives in the volumes above).
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    # Longer than the Caddyfile's grace_period (10 s), so Caddy closes its
    # connections itself before Docker kills it.
    stop_grace_period: 20s

volumes:
  pgdata:
  caddy_data:
  caddy_config:
